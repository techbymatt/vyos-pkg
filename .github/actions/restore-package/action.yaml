---
# $schema: https://json.schemastore.org/github-action.json
name: Restore package
description: Restore and upload one cached package, then clean up its restored files.
inputs:
  entry:
    description: JSON object with package, arch, group, and the full cache_key.
    required: true
runs:
  using: composite
  steps:
    - uses: ./workflow/.github/actions/package-cache-compression
    - id: paths
      uses: ./workflow/.github/actions/package-paths
      with:
        group: ${{ fromJSON(inputs.entry).group }}
        package: ${{ fromJSON(inputs.entry).package }}
    - name: Restore the cached build
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ fromJSON(inputs.entry).cache_key }}
        path: ${{ steps.paths.outputs.cache }}
    - name: Check and upload package artifacts
      if: ${{ steps.restore.outputs.cache-hit == 'true' }}
      uses: ./workflow/.github/actions/package-artifacts
      with:
        group: ${{ fromJSON(inputs.entry).group }}
        package: ${{ fromJSON(inputs.entry).package }}
        arch: ${{ fromJSON(inputs.entry).arch }}
    - name: Save the verified legacy build under its source key
      if: ${{ steps.restore.outputs.cache-hit == 'true' && fromJSON(inputs.entry).save_cache_key != null }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ fromJSON(inputs.entry).save_cache_key }}
        path: ${{ steps.paths.outputs.cache }}
    - name: Clean up restored package files
      if: ${{ always() }}
      shell: bash
      env:
        GROUP: ${{ fromJSON(inputs.entry).group }}
        PACKAGE: ${{ fromJSON(inputs.entry).package }}
      run: |
        python3 "$GITHUB_ACTION_PATH/../../../scripts/package_layout.py" clean \
          --group "$GROUP" --package "$PACKAGE"
