---
name: Package artifact paths
description: Shared relative path contract for package caching, uploads and cleanup.
inputs:
  group:
    description: Build group (build or build-extra).
    required: true
  package:
    description: Source package name.
    required: true
outputs:
  directory:
    description: Directory containing binary outputs.
    value: ${{ steps.paths.outputs.directory }}
  debs:
    description: Binary artifact glob.
    value: ${{ steps.paths.outputs.debs }}
  sources:
    description: Source and build metadata globs.
    value: ${{ steps.paths.outputs.sources }}
  cache:
    description: Ordered cache path contract, also used for cleanup.
    value: ${{ steps.paths.outputs.cache }}
runs:
  using: composite
  steps:
    - id: paths
      shell: bash
      env:
        GROUP: ${{ inputs.group }}
        PACKAGE: ${{ inputs.package }}
      run: |
        python3 "$GITHUB_ACTION_PATH/../../../scripts/package_layout.py" outputs \
          --group "$GROUP" --package "$PACKAGE"
