---
# $schema: https://json.schemastore.org/github-workflow.json
concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false
env:
  BUILD_IMAGE: ghcr.io/techbymatt/vyos-build:rolling
jobs:
  cache-check:
    defaults:
      run:
        shell: bash
    name: Cache check
    outputs:
      changed: ${{ steps.plan.outputs.changed }}
      image: ${{ steps.image.outputs.image }}
      patch-commit: ${{ steps.plan.outputs.patch-commit }}
      build-extra-matrix: ${{ steps.plan.outputs.build-extra-matrix }}
      build-matrix: ${{ steps.plan.outputs.build-matrix }}
      restore-matrix: ${{ steps.plan.outputs.restore-matrix }}
    permissions:
      actions: read
      pages: read
      contents: read
      packages: read
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout workflow tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: workflow
      - id: image
        name: Resolve the build image digest
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "$BUILD_IMAGE" --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image=${BUILD_IMAGE%:*}@${digest}" >> "$GITHUB_OUTPUT"
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          owner: techbymatt
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - id: checkout
        name: Checkout the tbm-vyos-patch repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: patch
          fetch-depth: 0
          repository: techbymatt/tbm-vyos-patch
          submodules: recursive
          token: ${{ steps.app-token.outputs.token }}
      - id: plan
        name: Plan builds from the cache state
        working-directory: patch
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_IMAGE: ${{ steps.image.outputs.image }}
          FORCE_REBUILD: ${{ inputs.force_rebuild || false }}
        run: |
          set -euo pipefail
          force=()
          if [[ "$FORCE_REBUILD" == true ]]; then force+=(--force-rebuild); fi
          python3 ../workflow/scripts/plan_builds.py publish \
            --patch-root . --workflow-root ../workflow --image "$BUILD_IMAGE" \
            --repository-commit "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF" --run "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            "${force[@]}" >> "$GITHUB_OUTPUT"
      - name: Upload planned publication inputs
        if: ${{ steps.plan.outputs.changed == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: input-manifest
          path: workflow/input-manifest.json
          if-no-files-found: error
    timeout-minutes: 30
  build:
    if: ${{ fromJSON(needs.cache-check.outputs.build-matrix).include[0] != null }}
    needs: [cache-check]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/build-recipe.yaml
    with:
      matrix: ${{ needs.cache-check.outputs.build-matrix }}
      image: ${{ needs.cache-check.outputs.image }}
      build-ref: ${{ needs.cache-check.outputs.patch-commit }}
      cache: true
      max-parallel: 4
    secrets: inherit
  build-extra:
    if: ${{ fromJSON(needs.cache-check.outputs.build-extra-matrix).include[0] != null }}
    needs: [cache-check]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/build-standalone.yaml
    with:
      matrix: ${{ needs.cache-check.outputs.build-extra-matrix }}
      image: ${{ needs.cache-check.outputs.image }}
      build-ref: rolling
      cache: true
  restore-cached:
    if: ${{ fromJSON(needs.cache-check.outputs.restore-matrix).include[0] != null }}
    name: Restore (cache hit)
    needs:
      - cache-check
    permissions:
      contents: read
    runs-on: ${{ matrix.runner_label }}
    steps:
      - name: Checkout restore action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: workflow
      - name: Restore package 1
        if: ${{ matrix.entries[0] != null }}
        uses: ./workflow/.github/actions/restore-package
        with:
          entry: ${{ toJSON(matrix.entries[0]) }}
      - name: Restore package 2
        if: ${{ matrix.entries[1] != null }}
        uses: ./workflow/.github/actions/restore-package
        with:
          entry: ${{ toJSON(matrix.entries[1]) }}
      - name: Restore package 3
        if: ${{ matrix.entries[2] != null }}
        uses: ./workflow/.github/actions/restore-package
        with:
          entry: ${{ toJSON(matrix.entries[2]) }}
      - name: Restore package 4
        if: ${{ matrix.entries[3] != null }}
        uses: ./workflow/.github/actions/restore-package
        with:
          entry: ${{ toJSON(matrix.entries[3]) }}
      - name: Restore package 5
        if: ${{ matrix.entries[4] != null }}
        uses: ./workflow/.github/actions/restore-package
        with:
          entry: ${{ toJSON(matrix.entries[4]) }}
      - name: Restore package 6
        if: ${{ matrix.entries[5] != null }}
        uses: ./workflow/.github/actions/restore-package
        with:
          entry: ${{ toJSON(matrix.entries[5]) }}
      - name: Restore package 7
        if: ${{ matrix.entries[6] != null }}
        uses: ./workflow/.github/actions/restore-package
        with:
          entry: ${{ toJSON(matrix.entries[6]) }}
      - name: Restore package 8
        if: ${{ matrix.entries[7] != null }}
        uses: ./workflow/.github/actions/restore-package
        with:
          entry: ${{ toJSON(matrix.entries[7]) }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.cache-check.outputs.restore-matrix) }}
    timeout-minutes: 40
  verify:
    if: ${{ !cancelled() && needs.cache-check.outputs.changed == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && contains(needs.*.result, 'success') }}
    needs:
      - cache-check
      - build
      - build-extra
      - restore-cached
    uses: ./.github/workflows/verify-packages.yaml
    with:
      architectures: '["amd64","arm64"]'
  publish:
    if: ${{ !cancelled() && needs.verify.result == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    name: Publish
    needs:
      - verify
    permissions:
      contents: read
      id-token: write
      pages: write
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the vyos-pkg repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download planned publication inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: input-manifest
          path: ${{ runner.temp }}/publication
      - name: Download the .deb file artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
          path: packages/rolling
          pattern: deb-*
      - name: Download the build file artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
          path: packages/rolling
          pattern: build-*
      - name: Install required packages
        run: |
          sudo apt-get update
          sudo apt-get --no-install-recommends --yes install \
            gnupg2 \
            dpkg-dev
      - name: Insert environment variables
        run: |
          {
            echo GNUPGHOME="$(mktemp -d /tmp/pgpkeys-XXXXXX)"
            echo REPO_OWNER="$(echo "${GITHUB_REPOSITORY}" | cut -d/ -f1)"
          } >> "$GITHUB_ENV"
      - id: import_gpg
        name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - name: Confirm GPG key is loaded
        run: |
          gpg --list-keys | grep "${{ steps.import_gpg.outputs.fingerprint }}"
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
      - name: Build .deb repository
        run: |
          export GPG_FINGERPRINT="${{ steps.import_gpg.outputs.fingerprint }}"
          export ORIGIN="${{ steps.import_gpg.outputs.name }}"
          sudo chown -R "$(whoami):$(whoami)" _site/
          scripts/build_repo.sh
      - name: Generate directory indices
        uses: gacts/directory-listing@dbce3ff489d0e8689b0c45c6a63fe28b2a23ca66 # v1.0.6
        with:
          show-hidden: true
          target: _site/deb
      - name: Include publication inputs in the deployment
        run: cp "$RUNNER_TEMP/publication/input-manifest.json" _site/input-manifest.json
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
    timeout-minutes: 30
name: Repository
on:
  schedule:
    - cron: "42 20 * * *"
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Rebuild all packages and verify/publish even when recorded inputs match
        default: false
        type: boolean
permissions:
  contents: read
