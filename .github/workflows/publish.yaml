---
# $schema: https://json.schemastore.org/github-workflow.json
concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false
env:
  BUILD_IMAGE: ghcr.io/techbymatt/vyos-build:rolling
jobs:
  cache-check:
    defaults:
      run:
        shell: bash
    name: Cache check
    outputs:
      changed: ${{ steps.plan.outputs.changed }}
      image: ${{ steps.image.outputs.image }}
      patch-commit: ${{ steps.plan.outputs.patch-commit }}
      build-extra-matrix: ${{ steps.plan.outputs.build-extra-matrix }}
      build-matrix: ${{ steps.plan.outputs.build-matrix }}
      restore-matrix: ${{ steps.plan.outputs.restore-matrix }}
    permissions:
      actions: read
      pages: read
      contents: read
      packages: read
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout workflow tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: workflow
      - id: image
        name: Resolve the build image digest
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "$BUILD_IMAGE" --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image=${BUILD_IMAGE%:*}@${digest}" >> "$GITHUB_OUTPUT"
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          owner: techbymatt
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - id: checkout
        name: Checkout the tbm-vyos-patch repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: patch
          fetch-depth: 0
          repository: techbymatt/tbm-vyos-patch
          submodules: recursive
          token: ${{ steps.app-token.outputs.token }}
      - id: plan
        name: Plan builds from the cache state
        working-directory: patch
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_IMAGE: ${{ steps.image.outputs.image }}
          FORCE_REBUILD: ${{ inputs.force_rebuild || false }}
        run: |
          set -euo pipefail

          packages=(
            amazon-cloudwatch-agent
            amazon-ssm-agent
            aws-gwlbtun
            bash-completion
            blackbox_exporter
            ddclient
            dropbear
            ethtool
            frr
            frr_exporter
            hostap
            hsflowd
            iproute2
            isc-dhcp
            isc-kea
            keepalived
            libhtp
            libnss-mapuser
            libpam-radius-auth
            linux-kernel
            ndppd
            net-snmp
            netfilter
            node_exporter
            openssl
            openvpn
            openvpn-otp
            owamp
            podman
            pyhumps
            radvd
            shim-signed
            squid
            strongswan
            tacacs
            telegraf
            udp-broadcast-relay
            vyos-1x
            waagent
            wide-dhcpv6
            xen-guest-agent
            zerotier-one
          )
          extra_packages=(
            hvinfo
            ipaddrcheck
            libnss-tacplus
            libpam-tacplus
            libtacplus-map
            live-boot
            vyatta-bash
            vyatta-biosdevname
            vyatta-cfg
            vyos-http-api-tools
            vyos-live-build
          )

          package_dir_commit() {
            local package="$1"
            if [[ "$package" == 'linux-kernel' ]]; then
              git -C vyos-build log -n 1 --format=%H -- 'data/defaults.toml' "scripts/package-build/${package}/"
            else
              git -C vyos-build log -n 1 --format=%H -- "scripts/package-build/${package}/"
            fi
          }

          extra_package_commit() {
            local commit
            commit="$(git ls-remote "https://github.com/vyos/${1}.git" refs/heads/rolling | cut -f1)" || return 1
            [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || return 1
            printf '%s\n' "$commit"
          }

          record() {
            local list="$1" outcome="$2" package="$3" arch="$4" commit="$5" deps="$6"
            printf '%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$list" "$outcome" "$package" "$arch" "$commit" "$deps" >>"${decisions}"
            printf '%s/%s: cache %s (cache-%s-%s-%s)\n' \
              "$package" "$arch" "$outcome" "$package" "$arch" "$commit"
          }

          check_and_record() {
            local list="$1" package="$2" arch="$3" commit="$4" deps="$5"
            if [[ "$FORCE_REBUILD" != true ]] && grep -Fq "cache-v2-${package}-${arch}-${commit}-${cache_namespace}-" "${cached_keys}"; then
              record "$list" hit "$package" "$arch" "$commit" "$deps"
            else
              record "$list" miss "$package" "$arch" "$commit" "$deps"
            fi
          }

          workdir="$(mktemp -d)"
          trap 'rm -rf "${workdir}"' EXIT
          decisions="${workdir}/decisions.tsv"
          cached_keys="${workdir}/cached-keys.txt"

          patch_commit="$(git rev-parse HEAD)"
          echo "patch-commit=$patch_commit" >> "$GITHUB_OUTPUT"
          shared_build_inputs="$(git -C vyos-build ls-tree HEAD scripts/package-build/ | awk '$2 != "tree"')"
          cache_namespace="$(python3 ../workflow/scripts/cache_namespace.py \
            --build-image "$BUILD_IMAGE" --patch-tree "$(git rev-parse HEAD:patches)" \
            --shared-build-inputs "$shared_build_inputs" \
            --data-tree "$(git -C vyos-build rev-parse HEAD:data)" \
            --workflow ../workflow)"
          default_branch="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)"
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" \
            | jq -r --arg ref "$GITHUB_REF" --arg default "refs/heads/$default_branch" \
                '[.[].actions_caches[] | select(.ref == $ref or .ref == $default)]
                 | sort_by(.created_at) | reverse | .[].key' >"${cached_keys}"

          for package in "${packages[@]}"; do
            commit="$(package_dir_commit "$package")"
            [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
            arches="$(python3 ../workflow/scripts/package_build_policy.py architectures --group build --package "$package")"
            for arch in $arches; do
              check_and_record build "$package" "$arch" "$commit" ''
            done
          done

          for package in "${extra_packages[@]}"; do
            commit="$(extra_package_commit "$package")"
            deps="$(bash ../workflow/scripts/package_dependencies.sh "$package")"
            arches="$(python3 ../workflow/scripts/package_build_policy.py architectures --group build-extra --package "$package")"
            for arch in $arches; do
              check_and_record build-extra "$package" "$arch" "$commit" "$deps"
            done
          done

          python3 ../workflow/scripts/publish_manifest.py create \
            --decisions "$decisions" --repository-commit "$GITHUB_SHA" \
            --patch-commit "$patch_commit" --image "$BUILD_IMAGE" \
            --signing-key ../workflow/vyos-pkg.asc --output ../workflow/input-manifest.json
          changed=true
          if [[ "$FORCE_REBUILD" != true ]]; then
            if pages_url="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .html_url)" \
              && [[ "$pages_url" == https://* ]]; then
              if curl --fail --silent --show-error --location --retry 2 \
                --connect-timeout 10 --max-time 60 -H 'Cache-Control: no-cache' \
                "${pages_url%/}/input-manifest.json?run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
                --output "$workdir/published.json"; then
                if python3 ../workflow/scripts/publish_manifest.py compare \
                  --current ../workflow/input-manifest.json --published "$workdir/published.json"; then
                  changed=false
                else
                  echo "Published inputs differ or are invalid; rebuilding the publication."
                fi
              else
                echo "::warning::Published manifest unavailable; rebuilding the publication."
              fi
            else
              echo "::warning::Pages URL unavailable; rebuilding the publication."
            fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "Publication inputs changed (or refresh forced): $changed" >> "$GITHUB_STEP_SUMMARY"

          jq -rRs --rawfile cached_keys "$cached_keys" --arg namespace "$cache_namespace" \
            --arg run "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --arg changed "$changed" \
            -f ../workflow/scripts/publish_matrix.jq "${decisions}" >>"${GITHUB_OUTPUT}"
      - name: Upload planned publication inputs
        if: ${{ steps.plan.outputs.changed == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: input-manifest
          path: workflow/input-manifest.json
          if-no-files-found: error
    timeout-minutes: 30
  build:
    container:
      env:
        TZ: Australia/Brisbane
      image: ${{ needs.cache-check.outputs.image }}
      options: "--privileged --sysctl net.ipv6.conf.lo.disable_ipv6=0"
    defaults:
      run:
        shell: bash
    if: ${{ fromJSON(needs.cache-check.outputs.build-matrix).include[0] != null }}
    name: Build (container)
    needs:
      - cache-check
    permissions:
      contents: read
      packages: read
    runs-on: ${{ matrix.runner_label }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          owner: techbymatt
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - id: checkout
        name: Checkout the tbm-vyos-patch repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.cache-check.outputs.patch-commit }}
          fetch-depth: 0
          repository: techbymatt/tbm-vyos-patch
          submodules: recursive
          token: ${{ steps.app-token.outputs.token }}
      - name: Checkout build policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: workflow
          sparse-checkout: scripts
      - id: patch_vyos_build
        name: Patch vyos-build
        run: |
          cp --verbose ../patches/vyos-build/*.patch .
          git apply --3way --verbose ./*.patch
        working-directory: vyos-build
      - name: Apply package build policy
        run: |
          python3 workflow/scripts/prepare_package_build.py \
            --root vyos-build/scripts/package-build \
            --package "${{ matrix.package }}" --arch "${{ matrix.arch }}"
      - name: Setup golang
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
      - if: ${{ matrix.arch == 'amd64' && matrix.package == 'shim-signed' }}
        name: Prefer VyOS shim dependencies
        run: |
          printf '%s\n' \
            'Package: shim-unsigned shim-helpers-amd64-signed shim-helpers-amd64-signed-template' \
            'Pin: origin "packages.vyos.net"' \
            'Pin-Priority: 1001' \
            | sudo tee /etc/apt/preferences.d/vyos-shim >/dev/null
      - id: cache
        name: Cache build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ matrix.cache_key }}
          path: |
            vyos-build/scripts/package-build/${{ matrix.package }}/*.deb
            vyos-build/scripts/package-build/**/*.buildinfo
            vyos-build/scripts/package-build/**/*.changes
            vyos-build/scripts/package-build/**/*.dsc
            vyos-build/scripts/package-build/**/*debian.tar.*
            vyos-build/scripts/package-build/**/*orig.tar.*
      - if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        name: Build the package
        run: |
          python3 build.py
        working-directory: vyos-build/scripts/package-build/${{ matrix.package }}
      - name: List the .deb files built
        run: |
          ls -halp vyos-build/scripts/package-build/${{ matrix.package }}/*.deb
      - name: Check package build outputs
        run: |
          python3 workflow/scripts/package_build_policy.py check \
            --group build --package "${{ matrix.package }}" --arch "${{ matrix.arch }}" \
            --directory "vyos-build/scripts/package-build/${{ matrix.package }}"
      - name: Upload the .deb files as artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          compression-level: 0
          if-no-files-found: error
          name: deb-${{ matrix.package }}-${{ matrix.arch }}
          path: |
            vyos-build/scripts/package-build/${{ matrix.package }}/*.deb
      - name: Upload the remaining build files as artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          compression-level: 0
          if-no-files-found: ignore
          name: build-${{ matrix.package }}-${{ matrix.arch }}
          path: |
            vyos-build/scripts/package-build/**/*.buildinfo
            vyos-build/scripts/package-build/**/*.changes
            vyos-build/scripts/package-build/**/*.dsc
            vyos-build/scripts/package-build/**/*debian.tar.*
            vyos-build/scripts/package-build/**/*orig.tar.*
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.cache-check.outputs.build-matrix) }}
      max-parallel: 4
    timeout-minutes: 150
  build-extra:
    container:
      env:
        TZ: Australia/Brisbane
      image: ${{ needs.cache-check.outputs.image }}
      options: "--privileged --sysctl net.ipv6.conf.lo.disable_ipv6=0"
    defaults:
      run:
        shell: bash
    if: ${{ fromJSON(needs.cache-check.outputs.build-extra-matrix).include[0] != null }}
    name: Build (extra)
    needs:
      - cache-check
    permissions:
      contents: read
      packages: read
    runs-on: ${{ matrix.runner_label }}
    steps:
      - id: checkout
        name: Checkout the package repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: packages/${{ matrix.package }}
          ref: ${{ matrix.commit }}
          repository: vyos/${{ matrix.package }}
      - name: Checkout build policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: workflow
          sparse-checkout: scripts
      - id: cache
        name: Cache build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ matrix.cache_key }}
          path: |
            packages/*.deb
            packages/*.buildinfo
            packages/*.changes
            packages/*.dsc
            packages/*debian.tar.*
            packages/*orig.tar.*
      - if: ${{ steps.cache.outputs.cache-hit != 'true' && matrix.deps }}
        name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ${{ matrix.deps }}
      - name: Apply standalone package build policy
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        run: |
          python3 workflow/scripts/prepare_package_build.py \
            --group build-extra --root packages \
            --package "${{ matrix.package }}" --arch "${{ matrix.arch }}"
      - if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        name: Build the package
        run: |
          if [[ -z '${{ matrix.deps }}' ]]; then
            sudo apt-get update
          fi
          build_type=binary
          if [[ '${{ matrix.arch }}' == arm64 ]]; then build_type=any; fi
          dpkg-buildpackage --build="$build_type" --post-clean --unsigned-changes --unsigned-source
        working-directory: packages/${{ matrix.package }}
      - name: List the .deb files built
        run: |
          ls -halp packages/*.deb
      - name: Check package build outputs
        run: |
          python3 workflow/scripts/package_build_policy.py check \
            --group build-extra --package "${{ matrix.package }}" --arch "${{ matrix.arch }}" \
            --directory packages
      - name: Upload the .deb files as artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          compression-level: 0
          if-no-files-found: error
          name: deb-${{ matrix.package }}-${{ matrix.arch }}
          path: |
            packages/*.deb
      - name: Upload the remaining build files as artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          compression-level: 0
          if-no-files-found: ignore
          name: build-${{ matrix.package }}-${{ matrix.arch }}
          path: |
            packages/*.buildinfo
            packages/*.changes
            packages/*.dsc
            packages/*debian.tar.*
            packages/*orig.tar.*
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.cache-check.outputs.build-extra-matrix) }}
      max-parallel: 4
    timeout-minutes: 30
  restore-cached:
    if: ${{ fromJSON(needs.cache-check.outputs.restore-matrix).include[0] != null }}
    name: Restore (cache hit)
    needs:
      - cache-check
    permissions:
      contents: read
    runs-on: ${{ matrix.runner_label }}
    steps:
      - name: Checkout restore action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore package 1
        if: ${{ matrix.entries[0] != null }}
        uses: ./.github/actions/restore-package
        with:
          entry: ${{ toJSON(matrix.entries[0]) }}
      - name: Restore package 2
        if: ${{ matrix.entries[1] != null }}
        uses: ./.github/actions/restore-package
        with:
          entry: ${{ toJSON(matrix.entries[1]) }}
      - name: Restore package 3
        if: ${{ matrix.entries[2] != null }}
        uses: ./.github/actions/restore-package
        with:
          entry: ${{ toJSON(matrix.entries[2]) }}
      - name: Restore package 4
        if: ${{ matrix.entries[3] != null }}
        uses: ./.github/actions/restore-package
        with:
          entry: ${{ toJSON(matrix.entries[3]) }}
      - name: Restore package 5
        if: ${{ matrix.entries[4] != null }}
        uses: ./.github/actions/restore-package
        with:
          entry: ${{ toJSON(matrix.entries[4]) }}
      - name: Restore package 6
        if: ${{ matrix.entries[5] != null }}
        uses: ./.github/actions/restore-package
        with:
          entry: ${{ toJSON(matrix.entries[5]) }}
      - name: Restore package 7
        if: ${{ matrix.entries[6] != null }}
        uses: ./.github/actions/restore-package
        with:
          entry: ${{ toJSON(matrix.entries[6]) }}
      - name: Restore package 8
        if: ${{ matrix.entries[7] != null }}
        uses: ./.github/actions/restore-package
        with:
          entry: ${{ toJSON(matrix.entries[7]) }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.cache-check.outputs.restore-matrix) }}
    timeout-minutes: 40
  verify:
    defaults:
      run:
        shell: bash
    if: ${{ !cancelled() && needs.cache-check.outputs.changed == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && contains(needs.*.result, 'success') }}
    name: Verify
    needs:
      - cache-check
      - build
      - build-extra
      - restore-cached
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout verification tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
      - name: Download the .deb file artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: packages
          pattern: deb-*
      - name: Validate package integrity
        run: |
          python3 scripts/validate_packages.py --artifacts packages
      - name: Install Lintian
        run: |
          sudo apt-get update
          sudo apt-get --no-install-recommends --yes install lintian
      - name: Report Lintian advisories
        run: |
          shopt -s globstar nullglob
          packages=(./packages/**/*.deb)
          status=0
          lintian --no-cfg --allow-root "${packages[@]}" > lintian-report.txt 2>&1 || status=$?
          cat lintian-report.txt
          echo "Lintian exit status: $status (advisory only)" >> "$GITHUB_STEP_SUMMARY"
          if ((status != 0)); then
            echo "::warning::Lintian reported findings or could not complete; see lintian-report artifact."
          fi
      - name: Upload Lintian report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lintian-report
          path: lintian-report.txt
          if-no-files-found: error
    timeout-minutes: 30
  publish:
    if: ${{ !cancelled() && needs.verify.result == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    name: Publish
    needs:
      - verify
    permissions:
      contents: read
      id-token: write
      pages: write
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout the vyos-pkg repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download planned publication inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: input-manifest
          path: ${{ runner.temp }}/publication
      - name: Download the .deb file artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
          path: packages/rolling
          pattern: deb-*
      - name: Download the build file artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
          path: packages/rolling
          pattern: build-*
      - name: Install required packages
        run: |
          sudo apt-get update
          sudo apt-get --no-install-recommends --yes install \
            jq \
            createrepo-c \
            coreutils \
            gnupg2 \
            dpkg-dev
      - name: Insert environment variables
        run: |
          {
            echo GNUPGHOME="$(mktemp -d /tmp/pgpkeys-XXXXXX)"
            echo REPO_OWNER="$(echo "${GITHUB_REPOSITORY}" | cut -d/ -f1)"
            echo REPO_NAME="$(echo "${GITHUB_REPOSITORY}" | cut -d/ -f2)"
          } >> "$GITHUB_ENV"
      - id: import_gpg
        name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - name: Confirm GPG key is loaded
        run: |
          gpg --list-keys | grep "${{ steps.import_gpg.outputs.fingerprint }}"
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
      - name: Build .deb repository
        run: |
          export GPG_FINGERPRINT="${{ steps.import_gpg.outputs.fingerprint }}"
          export ORIGIN="${{ steps.import_gpg.outputs.name }}"
          sudo chown -R "$(whoami):$(whoami)" _site/
          scripts/build_repo.sh
      - name: Delete scripts/ repo
        run: |
          rm -r scripts
      - name: Generate directory indices
        uses: gacts/directory-listing@dbce3ff489d0e8689b0c45c6a63fe28b2a23ca66 # v1.0.6
        with:
          show-hidden: true
          target: _site/deb
      - name: Include publication inputs in the deployment
        run: cp "$RUNNER_TEMP/publication/input-manifest.json" _site/input-manifest.json
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
    timeout-minutes: 30
name: Repository
on:
  schedule:
    - cron: "42 20 * * *"
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Rebuild all packages and verify/publish even when recorded inputs match
        default: false
        type: boolean
permissions:
  contents: read
