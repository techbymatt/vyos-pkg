---
name: Verify package artifacts
on:
  workflow_call:
    inputs:
      architectures:
        description: JSON array of expected producer architectures.
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-26.04
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    steps:
      - name: Checkout verification tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
      - name: Download the .deb file artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: packages
          pattern: deb-*
          merge-multiple: false
      - name: Validate package integrity
        env:
          EXPECTED_ARCHES: ${{ inputs.architectures }}
        run: |
          python3 scripts/validate_packages.py --artifacts packages --expected-arches "$EXPECTED_ARCHES"
      - name: Install Lintian
        continue-on-error: true
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get --no-install-recommends --yes install lintian
      - name: Report Lintian advisories
        continue-on-error: true
        timeout-minutes: 12
        run: |
          python3 scripts/report_lintian.py --artifacts packages --report lintian-report.txt
      - name: Upload Lintian report
        if: ${{ always() && hashFiles('lintian-report.txt') != '' }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lintian-report
          path: lintian-report.txt
          if-no-files-found: error
