---
name: Verify package artifacts
on:
  workflow_call:
    inputs:
      architectures:
        description: JSON array of expected producer architectures.
        required: true
        type: string
      expected-artifacts:
        description: JSON array of expected deb-<source>-<arch> producer directories; empty disables the completeness check.
        required: false
        type: string
        default: ""
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-26.04
    defaults:
      run:
        shell: bash
    timeout-minutes: 75
    steps:
      - name: Checkout verification tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: Download the .deb file artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: packages
          pattern: deb-*
          merge-multiple: false
      - name: Validate package integrity
        env:
          EXPECTED_ARCHES: ${{ inputs.architectures }}
          EXPECTED_ARTIFACTS: ${{ inputs.expected-artifacts }}
        run: |
          arguments=()
          if [[ -n "$EXPECTED_ARTIFACTS" ]]; then
            arguments+=(--expected-artifacts "$EXPECTED_ARTIFACTS")
          fi
          python3 scripts/validate_packages.py --artifacts packages --expected-arches "$EXPECTED_ARCHES" --jobs 4 "${arguments[@]}"
      - name: Install Lintian
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get --no-install-recommends --yes install lintian
      - name: Report Lintian advisories
        timeout-minutes: 60
        run: |
          python3 scripts/report_lintian.py --artifacts packages --report lintian-report.txt --total-timeout 3600 --package-timeout 600 --jobs 4
      - name: Upload Lintian report
        if: ${{ always() && hashFiles('lintian-report.txt') != '' }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lintian-report
          path: lintian-report.txt
          if-no-files-found: error
