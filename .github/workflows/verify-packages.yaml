---
name: Verify package artifacts
on:
  workflow_call:
    inputs:
      architectures:
        description: JSON array of expected producer architectures.
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    steps:
      - name: Checkout verification tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
      - name: Download the .deb file artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: packages
          pattern: deb-*
          merge-multiple: false
      - name: Validate package integrity
        env:
          EXPECTED_ARCHES: ${{ inputs.architectures }}
        run: |
          python3 scripts/validate_packages.py --artifacts packages --expected-arches "$EXPECTED_ARCHES"
      - name: Install Lintian
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get --no-install-recommends --yes install lintian
      - name: Report Lintian advisories
        run: |
          shopt -s globstar nullglob
          packages=(./packages/**/*.deb)
          status=0
          lintian --no-cfg --allow-root "${packages[@]}" > lintian-report.txt 2>&1 || status=$?
          cat lintian-report.txt
          echo "Lintian exit status: $status (advisory only)" >> "$GITHUB_STEP_SUMMARY"
          if ((status != 0)); then
            echo "::warning::Lintian reported findings or could not complete; see lintian-report artifact."
          fi
      - name: Upload Lintian report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lintian-report
          path: lintian-report.txt
          if-no-files-found: error
