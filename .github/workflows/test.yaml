---
# $schema: https://json.schemastore.org/github-workflow.json
name: Test
on:
  workflow_dispatch:
    inputs:
      deps:
        description: A comma-separated list of dependency packages to install for standalone builds
        required: false
        type: string
      package:
        description: A comma-separated list of recipe source packages
        required: false
        type: string
      package-extra:
        description: A comma-separated list of standalone source packages
        required: false
        type: string
permissions:
  contents: read
jobs:
  setup-matrix:
    name: Setup matrix
    outputs:
      build-matrix: ${{ steps.plan.outputs.build-matrix }}
      build-extra-matrix: ${{ steps.plan.outputs.build-extra-matrix }}
      verify-arches: ${{ steps.plan.outputs.verify-arches }}
      verify-plan: ${{ steps.plan.outputs.verify-plan }}
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout build tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
      - id: plan
        name: Plan requested builds
        env:
          PACKAGES: ${{ inputs.package }}
          EXTRA_PACKAGES: ${{ inputs.package-extra }}
          DEPS: ${{ inputs.deps }}
        run: |
          python3 scripts/plan_builds.py test --packages "$PACKAGES" --extra-packages "$EXTRA_PACKAGES" --deps "$DEPS" >> "$GITHUB_OUTPUT"
    timeout-minutes: 5
  build:
    if: ${{ fromJSON(needs.setup-matrix.outputs.build-matrix || '{"include":[]}').include[0] != null }}
    needs: [setup-matrix]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/build-recipe.yaml
    with:
      matrix: ${{ needs.setup-matrix.outputs.build-matrix }}
      image: ghcr.io/techbymatt/vyos-build:rolling
      build-ref: ""
      cache: false
      max-parallel: 8
    secrets:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
  build-extra:
    if: ${{ fromJSON(needs.setup-matrix.outputs.build-extra-matrix || '{"include":[]}').include[0] != null }}
    needs: [setup-matrix]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/build-standalone.yaml
    with:
      matrix: ${{ needs.setup-matrix.outputs.build-extra-matrix }}
      image: ghcr.io/techbymatt/vyos-build:rolling
      build-ref: rolling
      cache: false
  verify:
    if: ${{ !cancelled() && fromJSON(needs.setup-matrix.outputs.verify-arches || '[]')[0] != null && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && contains(needs.*.result, 'success') }}
    needs:
      - setup-matrix
      - build
      - build-extra
    uses: ./.github/workflows/verify-packages.yaml
    with:
      architectures: ${{ needs.setup-matrix.outputs.verify-arches }}
      expected-artifacts: ${{ needs.setup-matrix.outputs.verify-plan }}
