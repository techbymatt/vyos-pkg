---
# $schema: https://json.schemastore.org/github-workflow.json
jobs:
  setup-matrix:
    name: Setup matrix
    outputs:
      package: ${{ steps.container.outputs.json }}
      package-extra: ${{ steps.container-extra.outputs.json }}
      deps: ${{ steps.deps.outputs.json }}
      build-matrix: ${{ steps.plan.outputs.build-matrix }}
      build-extra-matrix: ${{ steps.plan.outputs.build-extra-matrix }}
      verify-arches: ${{ steps.plan.outputs.verify-arches }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout build policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
      - id: container
        name: Parse container package list
        run: |
          input='${{ inputs.package }}'
          if ! printf '%s' "$input" | grep -qE '[^,[:space:]]+'; then
            json='[]'
          else
            json=$(printf '%s' "$input" | grep -oE '[^,[:space:]]+' | jq -R . | jq -sc .)
          fi
          echo "json=$json" >> "$GITHUB_OUTPUT"
      - id: container-extra
        name: Parse container package-extra list
        run: |
          input='${{ inputs.package-extra }}'
          if ! printf '%s' "$input" | grep -qE '[^,[:space:]]+'; then
            json='[]'
          else
            json=$(printf '%s' "$input" | grep -oE '[^,[:space:]]+' | jq -R . | jq -sc .)
          fi
          echo "json=$json" >> "$GITHUB_OUTPUT"
      - id: deps
        name: Parse container deps list
        run: |
          input='${{ inputs.deps }}'
          if ! printf '%s' "$input" | grep -qE '[^,[:space:]]+'; then
            json='[]'
          else
            json=$(printf '%s' "$input" | grep -oE '[^,[:space:]]+' | jq -R . | jq -sc .)
          fi
          echo "json=$json" >> "$GITHUB_OUTPUT"
      - id: plan
        name: Plan architecture ownership
        env:
          PACKAGES: ${{ steps.container.outputs.json }}
          EXTRA_PACKAGES: ${{ steps.container-extra.outputs.json }}
          DEPS: ${{ steps.deps.outputs.json }}
        run: |
          build="$(python3 scripts/package_build_policy.py matrix --group build --packages "$PACKAGES")"
          extra="$(python3 scripts/package_build_policy.py matrix --group build-extra --packages "$EXTRA_PACKAGES" --deps "$DEPS")"
          echo "build-matrix=$build" >> "$GITHUB_OUTPUT"
          echo "build-extra-matrix=$extra" >> "$GITHUB_OUTPUT"
          arches="$(jq -cn --argjson build "$build" --argjson extra "$extra" '[$build.include[].arch, $extra.include[].arch] | unique')"
          echo "verify-arches=$arches" >> "$GITHUB_OUTPUT"
    timeout-minutes: 5
  build:
    container:
      env:
        TZ: Australia/Brisbane
      image: ghcr.io/techbymatt/vyos-build:rolling
      options: "--privileged --sysctl net.ipv6.conf.lo.disable_ipv6=0"
    defaults:
      run:
        shell: bash
    name: Build (container)
    if: ${{ fromJSON(needs.setup-matrix.outputs.build-matrix).include[0] != null }}
    needs: [setup-matrix]
    permissions:
      contents: read
      packages: read
    runs-on: ${{ matrix.runner_label }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          owner: techbymatt
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - id: checkout
        name: Checkout the tbm-vyos-patch repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          repository: techbymatt/tbm-vyos-patch
          submodules: recursive
          token: ${{ steps.app-token.outputs.token }}
      - name: Checkout build policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: workflow
          sparse-checkout: scripts
      - id: patch_vyos_build
        name: Patch vyos-build
        run: |
          cp --verbose ../patches/vyos-build/*.patch .
          git apply --3way --verbose ./*.patch
        working-directory: vyos-build
      - name: Apply package build policy
        run: |
          python3 workflow/scripts/prepare_package_build.py \
            --root vyos-build/scripts/package-build \
            --package "${{ matrix.package }}" --arch "${{ matrix.arch }}"
      - name: Setup golang
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
      - if: ${{ matrix.arch == 'amd64' && matrix.package == 'shim-signed' }}
        name: Prefer VyOS shim dependencies
        run: |
          printf '%s\n' \
            'Package: shim-unsigned shim-helpers-amd64-signed shim-helpers-amd64-signed-template' \
            'Pin: origin "packages.vyos.net"' \
            'Pin-Priority: 1001' \
            | sudo tee /etc/apt/preferences.d/vyos-shim >/dev/null
      - name: Build the package
        run: |
          python3 build.py
        working-directory: vyos-build/scripts/package-build/${{ matrix.package }}
      - name: List the .deb files built
        run: |
          ls -halp vyos-build/scripts/package-build/**/*.deb
      - name: Check package build outputs
        run: |
          python3 workflow/scripts/package_build_policy.py check \
            --group build --package "${{ matrix.package }}" --arch "${{ matrix.arch }}" \
            --directory "vyos-build/scripts/package-build/${{ matrix.package }}"
      - name: Upload the .deb files as artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: deb-${{ matrix.package }}-${{ matrix.arch }}
          path: |
            vyos-build/scripts/package-build/${{ matrix.package }}/*.deb
      - name: Upload the remaining build files as artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ matrix.package }}-${{ matrix.arch }}
          path: |
            vyos-build/scripts/package-build/**/*.buildinfo
            vyos-build/scripts/package-build/**/*.changes
            vyos-build/scripts/package-build/**/*.dsc
            vyos-build/scripts/package-build/**/*debian.tar.*
            vyos-build/scripts/package-build/**/*orig.tar.*
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup-matrix.outputs.build-matrix) }}
      max-parallel: 8
    timeout-minutes: 150
  build-extra:
    container:
      env:
        TZ: Australia/Brisbane
      image: ghcr.io/techbymatt/vyos-build:rolling
      options: "--privileged --sysctl net.ipv6.conf.lo.disable_ipv6=0"
    defaults:
      run:
        shell: bash
    name: Build (extra)
    if: ${{ fromJSON(needs.setup-matrix.outputs.build-extra-matrix).include[0] != null }}
    needs: [setup-matrix]
    permissions:
      contents: read
      packages: read
    runs-on: ${{ matrix.runner_label }}
    steps:
      - id: checkout
        name: Checkout the package repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: packages/${{ matrix.package }}
          ref: rolling
          repository: vyos/${{ matrix.package }}
      - name: Checkout build policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: workflow
          sparse-checkout: scripts
      - if: ${{ matrix.deps }}
        name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ${{ matrix.deps }}
      - name: Apply standalone package build policy
        run: |
          python3 workflow/scripts/prepare_package_build.py \
            --group build-extra --root packages \
            --package "${{ matrix.package }}" --arch "${{ matrix.arch }}"
      - name: Build the package
        run: |
          sudo apt-get update
          build_type=binary
          if [[ '${{ matrix.arch }}' == arm64 ]]; then build_type=any; fi
          dpkg-buildpackage --build="$build_type" --post-clean --unsigned-changes --unsigned-source
        working-directory: packages/${{ matrix.package }}
      - name: List the .deb files built
        run: |
          ls -halp packages/*.deb
      - name: Check package build outputs
        run: |
          python3 workflow/scripts/package_build_policy.py check \
            --group build-extra --package "${{ matrix.package }}" --arch "${{ matrix.arch }}" \
            --directory packages
      - name: Upload the .deb files as artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: deb-${{ matrix.package }}-${{ matrix.arch }}
          path: |
            packages/*.deb
      - name: Upload the remaining build files as artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ matrix.package }}-${{ matrix.arch }}
          path: |
            packages/*.buildinfo
            packages/*.changes
            packages/*.dsc
            packages/*debian.tar.*
            packages/*orig.tar.*
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup-matrix.outputs.build-extra-matrix) }}
      max-parallel: 4
  verify:
    defaults:
      run:
        shell: bash
    if: ${{ !cancelled() && fromJSON(needs.setup-matrix.outputs.verify-arches || '[]')[0] != null && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && contains(needs.*.result, 'success') }}
    name: Verify
    needs:
      - setup-matrix
      - build
      - build-extra
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout verification tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
      - name: Download the .deb file artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: packages
          pattern: deb-*-${{ matrix.arch }}
      - name: Validate package integrity
        run: |
          shopt -s globstar nullglob
          packages=(./packages/**/*.deb)
          python3 scripts/validate_packages.py --arch "${{ matrix.arch }}" "${packages[@]}"
      - name: Install Lintian
        run: |
          sudo apt-get update
          sudo apt-get --no-install-recommends --yes install lintian
      - name: Report Lintian advisories
        run: |
          shopt -s globstar nullglob
          packages=(./packages/**/*.deb)
          status=0
          lintian --no-cfg --allow-root "${packages[@]}" > lintian-report.txt 2>&1 || status=$?
          cat lintian-report.txt
          echo "Lintian exit status: $status (advisory only)" >> "$GITHUB_STEP_SUMMARY"
          if ((status != 0)); then
            echo "::warning::Lintian reported findings or could not complete; see lintian-report artifact."
          fi
      - name: Upload Lintian report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lintian-report-${{ matrix.arch }}
          path: lintian-report.txt
          if-no-files-found: error
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.setup-matrix.outputs.verify-arches) }}
    timeout-minutes: 30
name: Test
on:
  workflow_dispatch:
    inputs:
      deps:
        description: A comma-separated list of dependency packages to be installed into the vyos-build container
        required: false
        type: string
      package:
        description: A comma-separated list of packages to be built using the vyos-build container
        required: false
        type: string
      package-extra:
        description: A comma-separated list of packages from outside the vyos-build repository to be built using the vyos-build container
        required: false
        type: string
permissions:
  contents: read
